name: Deploy Vue Vite Project via SSH Deploy Key

on:
  push:
    branches:
      - admin   # 监听 admin 分支 push

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout 仓库
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ 设置 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # 3️⃣ 安装依赖
      - name: Install dependencies
        run: npm ci

      # 4️⃣ 构建项目
      - name: Build project
        run: npm run build

      # 5️⃣ 部署到 gh-pages 分支（自动清理旧文件）
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}   # SSH deploy key
          publish_dir: ./dist                              # 构建输出目录
          publish_branch: gh-pages                         # 部署目标分支
          force_orphan: true                               # 保证 gh-pages 只包含最新内容
          cname: DIY_AVatar.com                            # 自定义域名
          commit_message: "📦 Deploy latest build via Actions"   # 提交信息
